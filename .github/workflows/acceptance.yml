name: Required networks acceptance
on:
  push:
    branches: [main, 'delivery/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python scripts/restore_models.py
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test -- --reporter=json --outputFile=../test-results/frontend.json
      - run: npm run build
      - run: python -m pytest -q --junitxml=test-results/backend.xml
      - run: python scripts/verify_delivery.py --output test-results/native-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.os }}
          path: test-results/
          retention-days: 14
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/restore_models.py
      - run: python -m pip install -r requirements-dev.txt
      - run: npm --prefix frontend ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm --prefix frontend run test:e2e
        env:
          INVOICE_DATA_DIR: ${{ runner.temp }}/piao-browser
          INVOICE_SEED_DEMO: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-browser-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install httpx==0.28.1
      - run: npm --prefix frontend ci
      - run: npm run build
      - run: docker build -t piao-acceptance .
      - run: docker run -d --name piao-acceptance -p 127.0.0.1:18000:8000 piao-acceptance
      - run: python scripts/verify_delivery.py --base-url http://127.0.0.1:18000 --output test-results/docker-smoke.json
      - if: always()
        run: docker logs piao-acceptance
      - if: always()
        run: docker rm -f piao-acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-evidence
          path: test-results/
          retention-days: 14
